# cp .env.example .env && docker compose up -d && curl localhost/health

name: ${COMPOSE_PROJECT_NAME:-disease-signal}

networks:
  appnet:
    driver: bridge

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=${TZ:-Asia/Seoul}
    networks: [appnet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 서비스 추가 시: networks 에 appnet 참여, ports 대신 expose(진입은 nginx만),
