name: ${COMPOSE_PROJECT_NAME:?ENV 파일을 지정하세요 (--env-file .env.prod)}

networks:
  appnet:
    driver: bridge
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

volumes:
  pgdata:

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM:-2g}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-company_analysis}
      - POSTGRES_USER=${POSTGRES_USER:-ssafy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}
      - POSTGRES_INITDB_ARGS=--locale-provider=icu --icu-locale=ko-KR --encoding=UTF8
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-ssafy} -d ${POSTGRES_DB:-company_analysis} -tAc 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [appnet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${REGISTRY:-local}/backend:${TAG:?환경별로 달라야 한다 (prod/dev/local)}
    build:
      context: ../backend
    restart: unless-stopped
    expose: ["8080"]
    mem_limit: ${BACKEND_MEM:-2g}
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-company_analysis}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-ssafy}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}
      # 허용할 FE 오리진(콤마 구분). 비우면 CORS 를 켜지 않는다.
      # prod/dev 는 proxy 가 FE·BE 를 같은 오리진으로 묶으므로 비워 둔다.
      # 로컬(docker-compose.local.yml)은 FE :3000 / BE :8080 으로 오리진이 갈리므로 채워야 한다.
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-}
      # 이메일 인증 메일. SMTP 미설정이면 발송을 건너뛰고 링크를 로그로 남긴다.
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-no-reply@company-analysis.local}
      # 인증 링크가 가리킬 공개 사이트 주소. prod/dev 는 각 도메인으로 설정한다.
      - APP_FRONTEND_BASE_URL=${APP_FRONTEND_BASE_URL:-http://localhost:5173}
      - GMS_KEY=${GMS_KEY:-}
      # 모의 면접 LLM. provider=vllm(개발)이면 LLM_KEY·VLLM_BASE_URL, gms(시연)면 위 GMS_KEY 를 쓴다.
      - AI_INTERVIEW_PROVIDER=${AI_INTERVIEW_PROVIDER:-vllm}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://70.12.130.105:8000}
      - LLM_KEY=${LLM_KEY:-}
      # 모의 면접 LLM 시간당 호출 상한(질문생성+꼬리질문+분석 합산). 미설정이면 40. QA 반복 시 .env 에서 올린다.
      - APP_INTERVIEW_RATE_LIMIT_USER_LIMIT=${APP_INTERVIEW_RATE_LIMIT_USER_LIMIT:-40}
      # 자소서 검토 방 발화 시간당 상한. 발화 한 번에 에이전트를 여럿 부르므로 기본값이 낮다.
      # 미설정이면 20. QA 로 수십 턴을 돌릴 때는 .env 에서 올린다.
      - APP_AGENT_RATE_LIMIT_USER_LIMIT=${APP_AGENT_RATE_LIMIT_USER_LIMIT:-20}
      # 자소서 멀티에이전트. 고를 수 있게 열어 둘 직무(쉼표 구분). 적재하는 자료는 없다.
      # 비우면 모든 직무가 ready=false 로 나가 포지션 담당을 아예 못 쓴다.
      - APP_AGENT_READY_JOB_ROLES=${APP_AGENT_READY_JOB_ROLES:-}
      # Vector DB 가 만들어진 기업(corpCode). 비우면 기업 선택을 막지 않는다.
      - APP_AGENT_RAG_INDEXED_CORP_CODES=${APP_AGENT_RAG_INDEXED_CORP_CODES:-}
      # 화면에서 감추고 실행도 막을 담당(쉼표 구분 agentKey). 뉴스 담당이 불안정해 QA 동안 기본으로 끈다.
      # 콜론 없는 '-' 라 .env 에 빈 값(APP_AGENT_HIDDEN_AGENTS=)을 적으면 전부 다시 켜진다.
      - APP_AGENT_HIDDEN_AGENTS=${APP_AGENT_HIDDEN_AGENTS-news}
      - TZ=${TZ:-Asia/Seoul}
      - AGENT_AI_BASE_URL=${AGENT_AI_BASE_URL:-http://ai:8000}
    # 배포에서 vLLM 은 호스트의 리버스터널 포트(host.docker.internal:18000)로 닿는다. infra/tunnel 참고.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      appnet:
      edge:
        aliases:
          - backend-${ENV_NAME:?ENV_NAME 설정 필요 (prod|dev|local)}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: ${REGISTRY:-local}/ai:${TAG:?환경별로 달라야 한다 (prod/dev/local)}
    build:
      context: ../ai
    restart: unless-stopped
    expose: ["8000"]
    mem_limit: ${AI_MEM:-1g}
    environment:
      # 프록시가 /ai/ 로 넘기므로 문서·openapi 경로를 맞춘다. 로컬 직접 접속은 비운다.
      - AI_ROOT_PATH=${AI_ROOT_PATH-/ai}
      # jd_coaching 은 backend 와 같은 DB 를 쓴다(Flyway V20·V21 테이블).
      - JD_DATABASE_URL=postgresql://${POSTGRES_USER:-ssafy}:${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}@postgres:5432/${POSTGRES_DB:-company_analysis}
      - JD_MAX_CONCURRENCY=${JD_MAX_CONCURRENCY:-4}
      # 기업 분석 담당. 확정 지표·리포트는 backend 와 같은 DB 를 쓴다(Flyway V27~V33).
      - COMPANY_ANALYSIS_DATABASE_URL=postgresql://${POSTGRES_USER:-ssafy}:${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}@postgres:5432/${POSTGRES_DB:-company_analysis}
      # 사업보고서 청크·임베딩은 따로 둘 수 있다. 배치로 다시 만드는 파생 데이터라 사용자 DB 와
      # 수명이 다르고 크다. 비우면 위 DB 를 그대로 쓴다.
      - COMPANY_ANALYSIS_RAG_DATABASE_URL=${COMPANY_ANALYSIS_RAG_DATABASE_URL:-}
      # 질의 임베딩 서버(OpenAI 호환). 적재 때 쓴 것과 같은 모델이어야 검색이 맞는다.
      - COMPANY_ANALYSIS_EMBEDDING_BASE_URL=${COMPANY_ANALYSIS_EMBEDDING_BASE_URL:-}
      - COMPANY_ANALYSIS_EMBEDDING_API_KEY=${COMPANY_ANALYSIS_EMBEDDING_API_KEY:-${LLM_KEY:-}}
      # 검색이 고를 벡터. 적재 때 쓴 모델·버전과 같아야 한 건이라도 찾는다.
      # 비우면 코드 기본값(Qwen3-Embedding-0.6B / document-v1)을 쓴다.
      - COMPANY_ANALYSIS_EMBEDDING_MODEL_NAME=${COMPANY_ANALYSIS_EMBEDDING_MODEL_NAME:-}
      - COMPANY_ANALYSIS_EMBEDDING_VERSION=${COMPANY_ANALYSIS_EMBEDDING_VERSION:-}
      # backend 와 같은 vLLM. 주소는 VLLM_BASE_URL 에 /v1 을 붙이고, 키는 LLM_KEY 를 재사용한다.
      - QWEN_BASE_URL=${VLLM_BASE_URL:-http://70.12.130.105:8000}/v1
      # 서빙 중인 모델 ID 는 main 하나다 (GET /v1/models 로 확인).
      - QWEN_MODEL=${QWEN_MODEL:-main}
      # LLM 공급자. vllm(사내 GPU, 기본) | gms(SSAFY GMS 경유 Gemini).
      # 담당 하나만 옮겨 보려면 <PREFIX>_LLM_PROVIDER 로 덮어쓴다 (예: COMPANY_ANALYSIS_LLM_PROVIDER).
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - COMPANY_ANALYSIS_LLM_PROVIDER=${COMPANY_ANALYSIS_LLM_PROVIDER:-}
      - GMS_MODEL=${GMS_MODEL:-}
      - QWEN_API_KEY=${LLM_KEY:-}
      - GMS_MAX_CONCURRENT_REQUESTS=${GMS_MAX_CONCURRENT_REQUESTS:-1}
      - GMS_MIN_INTERVAL_SECONDS=${GMS_MIN_INTERVAL_SECONDS:-1}
      - GMS_QUEUE_TIMEOUT_SECONDS=${GMS_QUEUE_TIMEOUT_SECONDS:-45}
      - GMS_RATE_LIMIT_COOLDOWN_SECONDS=${GMS_RATE_LIMIT_COOLDOWN_SECONDS:-10}
      - GMS_RATE_LIMIT_RETRY_COUNT=${GMS_RATE_LIMIT_RETRY_COUNT:-1}
      - GMS_MAX_QUEUED_REQUESTS=${GMS_MAX_QUEUED_REQUESTS:-40}
      # 변환된 응답 스키마가 이 글자 수를 넘으면 enum 없이 보낸다(기업 리포트 SWOT 근거 ID enum 이 400 을 냈다). 0 이면 검사 안 함.
      - GMS_MAX_SCHEMA_CHARS=${GMS_MAX_SCHEMA_CHARS:-30000}
      # 공고에서 회사명·직무명을 뽑는 보완 추출에만 쓴다. 비면 그 보완만 꺼지고 크롤링은 돈다.
      - GMS_KEY=${GMS_KEY:-}
      - TZ=${TZ:-Asia/Seoul}
    # backend 와 동일하게 호스트 리버스터널 포트로 vLLM 에 닿는다. infra/tunnel 참고.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      appnet:
      edge:
        aliases:
          - ai-${ENV_NAME:?ENV_NAME 설정 필요 (prod|dev|local)}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${REGISTRY:-local}/frontend:${TAG:?환경별로 달라야 한다 (prod/dev/local)}
    build:
      context: ../frontend
    restart: unless-stopped
    expose: ["80"]
    mem_limit: ${FRONTEND_MEM:-128m}
    environment:
      - TZ=${TZ:-Asia/Seoul}
    networks:
      appnet:
      edge:
        aliases:
          - frontend-${ENV_NAME:?ENV_NAME 설정 필요 (prod|dev|local)}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
