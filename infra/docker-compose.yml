name: ${COMPOSE_PROJECT_NAME:-company-analysis}

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-company_analysis}
      - POSTGRES_USER=${POSTGRES_USER:-ssafy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}
      - POSTGRES_INITDB_ARGS=--locale-provider=icu --icu-locale=ko-KR --encoding=UTF8
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-ssafy} -d ${POSTGRES_DB:-company_analysis} -tAc 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [appnet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${REGISTRY:-local}/backend:${TAG:-latest}
    build:
      context: ../backend
    restart: unless-stopped
    expose: ["8080"]
    mem_limit: 1g
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-company_analysis}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-ssafy}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}
      - TZ=${TZ:-Asia/Seoul}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${REGISTRY:-local}/frontend:${TAG:-latest}
    build:
      context: ../frontend
    restart: unless-stopped
    expose: ["80"]
    mem_limit: 128m
    environment:
      - TZ=${TZ:-Asia/Seoul}
    networks: [appnet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    mem_limit: 128m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=${TZ:-Asia/Seoul}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [appnet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
