name: ${COMPOSE_PROJECT_NAME:?ENV 파일을 지정하세요 (--env-file .env.prod)}

networks:
  appnet:
    driver: bridge
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

volumes:
  pgdata:

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM:-2g}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-company_analysis}
      - POSTGRES_USER=${POSTGRES_USER:-ssafy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}
      - POSTGRES_INITDB_ARGS=--locale-provider=icu --icu-locale=ko-KR --encoding=UTF8
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-ssafy} -d ${POSTGRES_DB:-company_analysis} -tAc 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [appnet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${REGISTRY:-local}/backend:${TAG:?환경별로 달라야 한다 (prod/dev/local)}
    build:
      context: ../backend
    restart: unless-stopped
    expose: ["8080"]
    mem_limit: ${BACKEND_MEM:-2g}
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-company_analysis}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-ssafy}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?환경변수에 POSTGRES_PASSWORD 설정 필요}
      # 허용할 FE 오리진(콤마 구분). 비우면 CORS 를 켜지 않는다.
      # prod/dev 는 proxy 가 FE·BE 를 같은 오리진으로 묶으므로 비워 둔다.
      # 로컬(docker-compose.local.yml)은 FE :3000 / BE :8080 으로 오리진이 갈리므로 채워야 한다.
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-}
      # 이메일 인증 메일. SMTP 미설정이면 발송을 건너뛰고 링크를 로그로 남긴다.
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-no-reply@company-analysis.local}
      # 인증 링크가 가리킬 공개 사이트 주소. prod/dev 는 각 도메인으로 설정한다.
      - APP_FRONTEND_BASE_URL=${APP_FRONTEND_BASE_URL:-http://localhost:5173}
      - GMS_KEY=${GMS_KEY:-}
      # 모의 면접 LLM. provider=vllm(개발)이면 LLM_KEY·VLLM_BASE_URL, gms(시연)면 위 GMS_KEY 를 쓴다.
      - AI_INTERVIEW_PROVIDER=${AI_INTERVIEW_PROVIDER:-vllm}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://70.12.130.105:8000}
      - LLM_KEY=${LLM_KEY:-}
      # 자소서 멀티에이전트. 직무 지식베이스가 적재된 직무만 적는다(쉼표 구분).
      # 비우면 모든 직무가 ready=false 로 나가 화면에서 고를 수 없다.
      - APP_AGENT_READY_JOB_ROLES=${APP_AGENT_READY_JOB_ROLES:-}
      # Vector DB 가 만들어진 기업(corpCode). 비우면 기업 선택을 막지 않는다.
      - APP_AGENT_RAG_INDEXED_CORP_CODES=${APP_AGENT_RAG_INDEXED_CORP_CODES:-}
      - TZ=${TZ:-Asia/Seoul}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      appnet:
      edge:
        aliases:
          - backend-${ENV_NAME:?ENV_NAME 설정 필요 (prod|dev|local)}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${REGISTRY:-local}/frontend:${TAG:?환경별로 달라야 한다 (prod/dev/local)}
    build:
      context: ../frontend
    restart: unless-stopped
    expose: ["80"]
    mem_limit: ${FRONTEND_MEM:-128m}
    environment:
      - TZ=${TZ:-Asia/Seoul}
    networks:
      appnet:
      edge:
        aliases:
          - frontend-${ENV_NAME:?ENV_NAME 설정 필요 (prod|dev|local)}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
