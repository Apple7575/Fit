# 리버스 프록시 + TLS. 앱과 분리해 상시 기동한다.
#   80   -> ACME 인증 및 HTTPS 리다이렉트
#   443  -> 운영(prod)
#   8000 -> 개발(dev)
#   8080 -> Jenkins
name: ca-proxy

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

volumes:
  certbot-conf:
  certbot-www:

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      - TZ=${TZ:-Asia/Seoul}
    # 갱신된 인증서를 반영하기 위해 6시간마다 reload 한다.
    command: >
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
