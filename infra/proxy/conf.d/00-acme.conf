server {
    listen 80;
    server_name j15a504.p.ssafy.io;

    # Let's Encrypt 인증 경로. HTTPS 로 리다이렉트하면 갱신이 실패하므로 예외로 둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 프록시 자신의 헬스체크용. = 로 정확히 일치시켜야 아래 리다이렉트에 먹히지 않는다.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
