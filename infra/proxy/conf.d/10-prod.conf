server {
    listen 443 ssl;
    http2 on;
    server_name j15a504.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15a504.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a504.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    # 컨테이너가 재생성되면 IP 가 바뀐다. 변수를 써서 요청 시점에 DNS 를 다시 조회한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream  backend-prod;
    set $frontend_upstream frontend-prod;
    set $ai_upstream       ai-prod;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # proxy_headers 의 60s 와 중복되므로 헤더를 직접 쓰고 180s 로 둔다.
    location /api/interviews {
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
    }

    # 공고 파싱은 이미지 OCR 때문에 60s 를 넘길 수 있다(조각마다 모델 호출).
    location /api/job-postings {
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://$backend_upstream:8080;
        include /etc/nginx/conf.d/proxy_headers;
    }

    # AI 서버는 백엔드가 도커 네트워크로 직접 쓴다. 밖으로 열지 않는다.
    location /ai/ {
        deny all;
    }

    location / {
        proxy_pass http://$frontend_upstream:80;
        include /etc/nginx/conf.d/proxy_headers;
    }
}
