server {
    listen 8000 ssl;
    http2 on;
    server_name j15a504.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15a504.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a504.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    # 컨테이너가 재생성되면 IP 가 바뀐다. 변수를 써서 요청 시점에 DNS 를 다시 조회한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream  backend-dev;
    set $frontend_upstream frontend-dev;
    set $ai_upstream       ai-dev;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://$backend_upstream:8080;
        include /etc/nginx/conf.d/proxy_headers;
    }

    # /ai/ 접두사를 떼고 넘긴다. FastAPI 는 AI_ROOT_PATH=/ai 로 문서 경로를 맞춘다.
    # proxy_pass 에 변수를 쓰면 뒤에 붙인 URI(/) 가 요청 경로 전체를 대체해 모든 요청이 GET / 로
    # 간다. 그래서 URI 를 붙이지 않고 rewrite 로 접두사만 뗀다.
    # proxy_headers 는 read_timeout 60s 를 포함해 중복 선언이 되므로 여기서는 직접 쓴다.
    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://$ai_upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # LLM 호출은 오래 걸릴 수 있다.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://$frontend_upstream:80;
        include /etc/nginx/conf.d/proxy_headers;
    }
}
