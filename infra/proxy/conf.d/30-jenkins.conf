map $http_upgrade $jenkins_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 ssl;
    http2 on;
    server_name j15a504.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15a504.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a504.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $jenkins_upstream jenkins;

    location / {
        proxy_pass http://$jenkins_upstream:8080;

        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $jenkins_connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }
}
