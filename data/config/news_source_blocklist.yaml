# 뉴스 시드에서 뺄 출처.
#
# 회사 이름이 제목에 들어갔다는 이유만으로 도박·게임 홍보 글이 검색에 걸린다.
# 100개사 8일치(22,224건)에서 스팸 키워드가 걸린 기사가 2,999건(13.5%)이었고,
# 그중 98%가 아래 세 곳에서 나왔다 (2026-09-15 실측).
#
# **출처 전체를 막는 것이라 근거 없이 넣지 않는다.** 아래 두 조건을 모두
# 만족할 때만 올린다.
#
#   ① 기사가 20건 이상 있다 — 한두 건으로는 그 출처의 성격을 알 수 없다
#   ② 스팸 비율이 50% 이상이다
#
# 그리고 **스팸 키워드가 없는 기사까지 눈으로 확인한다.** 아래 세 곳은 키워드에
# 안 걸린 기사도 전부 같은 성격이었다(배터리바둑이 · 로또3등금액 · bet365 ·
# 마사회홈페이지 …). 비율이 69%여도 나머지 31%가 멀쩡하면 막으면 안 된다.
#
# 반례로, 마이데일리는 49건 중 4건(8%)이 걸렸지만 실제 언론사라 넣지 않았다.
#
# 적용 지점은 시드(`pipeline/news/curate.py`)다. staged 계층은 그대로 둔다 —
# 판단이 바뀌면 다시 만들 수 있어야 하고, 무엇을 왜 뺐는지 세려면 원본이
# 남아 있어야 한다.

publishers:
