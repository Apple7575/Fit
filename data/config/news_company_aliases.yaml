# 회사 이름 별칭. 뉴스 검색어와 기업 마스터 이름이 다를 때 사람이 확인해서 적는다.
#
# `pipeline/news/corpmap.py` 는 정확일치와 표기 정규화까지만 자동으로 처리하고
# **추정 매칭을 하지 않는다.** 부분일치·유사도로 붙이면 "삼성전자" 검색 결과가
# 삼성전기에 붙는 식의 오류가 조용히 DB 로 들어가기 때문이다. 이 파일은 그 원칙을
# 깨는 것이 아니라, **사람이 확인한 것만** 예외로 등록하는 자리다.
#
# 등록 조건 — 근거가 이름 말고 하나 더 있어야 한다.
#
#   ① 종목코드가 같다 (제일 강한 근거. 이름은 겹쳐도 종목코드는 안 겹친다)
#   ② 또는 DART 고유번호를 공시에서 직접 확인했다
#
# 이름이 비슷하다는 이유만으로는 넣지 않는다.
#
# `names` 는 두 곳에서 쓴다.
#   · 수집  — 이 이름으로도 검색한다 (언론 표기가 마스터와 다를 때)
#   · 매핑  — 이 이름으로 온 기사를 corp_code 에 붙인다
#
# 100개사 수집에서 2건 나왔다. 전 종목(2,500개사)으로 가면 더 늘어난다.

aliases:
  - corp_code: "00261443"
    master_name: NC
    stock_code: "036570"
    names:
      - 엔씨소프트
    checked: 2026-09-15
    evidence: |
      기업 마스터 이름이 'NC' (dart_corp_name '(주)엔씨') 라 '엔씨소프트' 로
      검색한 기사 204건이 not_in_company_universe 로 전부 버려졌다.
      종목코드 036570 이 엔씨소프트다 — 이름이 아니라 종목코드로 확인했다.

  - corp_code: "00244455"
    master_name: 케이티앤지
    stock_code: "033780"
    names:
      - KT&G
    checked: 2026-09-15
    evidence: |
      매핑은 '케이티앤지' 로 되지만 **수집이 0건**이었다. 언론이 'KT&G' 로 쓴다.
      검색어를 더해야 기사가 들어온다.
      종목코드 033780 이 KT&G 다.
