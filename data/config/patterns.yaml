# 지표 추출 규칙
#
# 회사마다 계정명·라벨·구조가 다르다. 네 지표(매출·영업이익·R&D·직원)의 실패 원인이
# 전부 여기에 있었다. 그래서 "이름으로 찾는" 부분은 전부 이 파일로 뺀다.
#
#   원칙: 커버리지가 안 나오면 코드를 고치지 말고 이 목록을 늘린다.
#
# 값의 근거는 docs/DESIGN.md 4장(실제로 부딪힌 문제와 대응) 참고.
# 실측 기준: 13개사 x 5년 = 65건 (KSIC 중분류 26·58)
#
# 표기 규칙
#   names / *_row_names / tokens  : 정확일치 목록. 순서 = 우선순위
#   *_re / exclude                : 정규식 (반드시 작은따옴표로 감쌀 것)

# ---------------------------------------------------------------- 매출액
revenue:
  # 정확일치 + 우선순위 순. 위에서부터 먼저 채택한다.
  # 제조업은 '매출액', 금융·지주·게임사는 '영업수익'으로 온다.
  # '매출'/'수익' 단독은 너무 넓지만 exclude 로 걸러지므로 마지막 순위로만 둔다.
  names:
    - 매출액
    - 영업수익
    - 수익(매출액)
    - 영업수익(매출액)
    - 매출
    - 수익

  # 이름에 '수익'이 들어가지만 매출이 아닌 계정들.
  # 카카오 2021 응답에 기타수익 1.73조 / 금융수익 1,778억 / 이자수익 369억이 함께 왔다.
  exclude: '기타수익|금융수익|이자수익|배당금수익|임대수익|수수료수익|외환|처분이익|평가이익|지분법|법인세|영업외|중단영업|매출원가|매출총이익|매출채권|미수'

  # XBRL 표준계정코드. 단독으로는 신뢰할 수 없다 —
  #   카카오   영업수익 -> ifrs-full_GrossProfit (매출총이익 태그)
  #   크래프톤 영업수익 -> '-표준계정코드 미사용-'
  # 계정명과 병용해 교차검증에 쓴다. (경로 B)
  account_ids:
    - ifrs-full_Revenue
    - ifrs_Revenue
    - ifrs-full_RevenueFromContractsWithCustomers
    - ifrs-full_RevenueFromContractsWithCustomersRecognisedAtPointInTime

  # 전체재무제표(fnlttSinglAcntAll)는 회사 원문 계정명을 그대로 준다.
  # 넷마블 2023~25 = 'Ⅰ.영업수익' 처럼 번호 접두사가 붙어 정확일치가 실패한다.
  # 이 정규화로 경로 C 성공률이 47/50 -> 50/50 이 되었다.
  name_prefix_strip: '^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩIVX\d]+\s*[.．)\]]\s*'

# ------------------------------------------------------------- 영업이익
operating_profit:
  names:
    - 영업이익
    - 영업이익(손실)
    - 영업손익
    - 영업손실
  account_ids:
    - ifrs-full_ProfitLossFromOperatingActivities
    - dart_OperatingIncomeLoss
    - ifrs-full_OperatingIncomeLoss

# ----------------------------------------------------------- 당기순이익
# V7(S15P21A504-97)이 카탈로그에 넣은 기본 지표. 적재는 S15P21A504-121 이다.
net_income:
  # 주요계정(경로 A)은 표기가 하나뿐이다 — 13개사 x 5년 236행 전부 '당기순이익(손실)'.
  # 나머지는 전체재무제표(경로 C)의 회사 원문 계정명이고 실측 분포는 이렇다.
  #   87 당기순이익(손실)  45 당기순이익  6 연결당기순이익(손실)
  #    4 당기순이익(손실)(A)   4 Ⅴ.당기순이익(손실)   2 당기순손익
  # 'Ⅴ.' 같은 번호 접두사는 revenue.name_prefix_strip 이 떼어낸다.
  names:
    - 당기순이익(손실)
    - 당기순이익
    - 연결당기순이익(손실)
    - 당기순이익(손실)(A)
    - 당기순손익

  # 경로 B 는 ifrs-full_ProfitLoss **하나만** 쓴다. 이름이 비슷한 아래 계정들은
  # 값이 다르다. 목록에 넣으면 조용히 틀린 값이 들어온다.
  #   ProfitLossBeforeTax                          법인세차감전   108행
  #   ProfitLossAttributableToOwnersOfParent       지배기업 지분   22행
  #   ProfitLossAttributableToNoncontrollingInt…   비지배지분      18행
  #   ProfitLossFromContinuingOperations           계속영업        14행
  account_ids:
    - ifrs-full_ProfitLoss

# ------------------------------------------------------ 부채총계·자본총계
# V7(S15P21A504-97)이 debtRatio(부채총계 / 자본총계) 입력으로 심은 내부 지표다.
# is_active=FALSE 라 화면에 직접 나가지 않는다. 적재는 S15P21A504-121.
#
# **정확일치가 아니면 안 된다.** 전체재무제표에 '부채와자본총계'·'부채및자본총계'·
# '자본및부채총계' 같은 이름이 116행 있고 그 값은 자산총계다
# (전부 ifrs-full_EquityAndLiabilities). 부분일치로 찾으면 자본총계 자리에
# 자산총계가 들어간다 — 부채비율이 통째로 틀린다.
total_liabilities:
  names:
    - 부채총계
  account_ids:
    - ifrs-full_Liabilities

total_equity:
  # 주요계정 118행 중 1행(엔씨소프트 2021 개별)에 자본총계가 없다. DART 가 주지
  # 않은 것이고 수집 실패가 아니다. 연결 우선 규칙 덕분에 채택에는 걸리지 않는다 —
  # 실측 47건 전부 연결에서 값이 나온다. 그래서 자산총계-부채총계 역산은 넣지 않았다.
  # account_id 가 '-표준계정코드 미사용-' 인 행이 1건 있어 경로 C 를 함께 둔다.
  names:
    - 자본총계
  account_ids:
    - ifrs-full_Equity

# ------------------------------------------------------ R&D (사업보고서 원문)
rnd:
  # 후보 표 선정: 섹션 제목이 이 패턴인 표만 본다.
  # 이 제한이 없으면 재무제표 주석의 9,684행짜리 표를 잡는다(NAVER).
  section_title_re: '연구개발'

  # 금액 행. '연구개발비'가 반드시 포함돼야 한다.
  # '합계'/'계' 단독을 허용하면 아무 표의 아무 합계 행이나 걸린다.
  amount_row_re: '연구개발비용?(합계|총계|계)'

  # [WP-10 예정] 시프트업은 금액 행 라벨이 '합계' 단독이다.
  # 표 안에 '연구개발비'가 있을 때만 이 패턴을 추가로 허용한다.
  amount_row_fallback_re: '^(합계|계|소계)$'

  # 비율 행. 분모 이름이 회사마다 다르다.
  #   삼성전자 '연구개발비 / 매출액 비율'  /  NAVER '연구개발비/영업수익 비율'
  # '영업수익'이 빠져 있어 NAVER 5개 연도가 검증 실패 상태였다.
  ratio_row_re: '연구개발비.{0,20}(매출액|영업수익|매출|수익).{0,10}(비율|대비)|(매출액|영업수익|매출)대비.{0,10}연구개발'

  # 표 안에 매출액이 같이 적힌 경우(50건 중 1건, SK하이닉스).
  # 분자·분모가 같은 표라 단위를 몰라도 비율이 정확하다. 교차검증 경로 ①.
  revenue_row_names:
    - 매출액
    - 영업수익
    - 수익(매출액)
    - 매출

  # 금액 행이 아닌 행. '회계처리' 구분(판관비/제조경비/무형자산)과 정부보조금.
  exclude_row_re: '회계처리|무형자산|판매비|제조경비|정부보조|정부출연'

  # 값으로 인정할 셀. 숫자·콤마·소수점·%·괄호·부호·공백만 허용한다.
  # 이게 없으면 라벨 안의 계산식 '...÷당기매출액×100]' 에서 100을 값으로 읽는다.
  numeric_cell_re: '^[\d,.\s%()▲△\-–]+$'

  # DART 자체 마크업의 셀 태그
  cell_tags: [TD, TE, TH]

  # 단위 -> 원 환산 배수. 긴 것부터 검사해야 '백만원'이 '원'으로 오인되지 않는다.
  # 실측 분포: 백만원 31 / 천원 14 / 원 5
  units:
    - { name: 백만원, multiplier: 1000000 }
    - { name: 천원,   multiplier: 1000 }
    - { name: 억원,   multiplier: 100000000 }
    - { name: 원,     multiplier: 1 }

  # 단위 표기는 표 앞 문장이 아니라 직전의 1행 1열 표에 들어있다(50건 중 44건).
  # 자기 표부터 직전 N개까지 거슬러 올라가며 '단위'를 찾는다.
  unit_lookback_tables: 3

  # 연결/별도가 한 표에 섞인 경우(50건 중 10건, NAVER·카카오)
  #   과 목 | 연결 | 연결 | 별도 | 별도
  # 헤더에서 열을 찾아 연결을 우선한다. 순서에 의존하면 조용히 틀린다.
  consolidated_header: 연결
  separate_header: 별도
  header_scan_rows: 3

# ------------------------------------------------------------- 직원 현황
employee:
  # 합계 행 라벨. '성별합계' 라는 표기를 쓴다(삼성전자·엔씨소프트·LG전자).
  # 인원 집계에서 제외하지 않으면 직원수가 2배가 된다.
  total_row_re: '^(성별)?(합계|총계|계)$|^전체$'

  null_tokens: ['', '-', '–', '—', '해당사항 없음', '해당사항없음', 'N/A', '미기재', '없음']

  # 응답 필드명. 문서만 보고 짐작하면 틀린다 —
  # 평균근속은 avrg_cnttk_sdytrn 이 아니라 avrg_cnwk_sdytrn 이다.
  fields:
    segment: fo_bbm
    gender: sexdstn
    regular: rgllbr_co
    contract: cnttk_co
    total: sm
    tenure: avrg_cnwk_sdytrn
    salary_per_person: jan_salary_am
    salary_total: fyer_salary_totamt

# ------------------------------------------------------------- 판정 임계값
# 감으로 정한 값이 아니다. 근거를 함께 남긴다.
thresholds:
  # R&D 비율 교차검증 허용 오차(%p).
  # 근거: high 41건 중 최대 오차가 엔씨소프트 0.43%p.
  #       보고서가 비율을 정수로 반올림해 적기 때문(계산 21.58% -> 보고 '22%').
  rnd_ratio_tolerance_pp: 0.5

  # R&D 비율 상식 범위(%). 벗어나면 단위 오인을 의심한다.
  rnd_ratio_min_pct: 0.0
  rnd_ratio_max_pct: 60.0

  # 매출 경로(A·B·C) 간 허용 상대오차. 같은 값을 다른 방법으로 찾은 것이므로 엄격하게.
  # 실측: 겹치는 43건 전부 오차 0.00%
  revenue_path_tolerance: 0.005

  # R&D 역산 매출(경로 D)은 회사가 어떤 분모를 썼는지 모르므로 보조 증거로만 쓴다.
  # API 경로가 2개 이상이면 판정에서 제외. 1개뿐일 때만 대조 상대로 사용.
  # 허용오차는 보고비율의 표기 자릿수에서 계산한다:
  #   '19%'   -> 반올림 ±0.5%p  -> 매출 역산 ±2.6% 허용
  #   '18.5%' -> 반올림 ±0.05%p -> 매출 역산 ±0.27% 허용
  backcalc_extra_margin: 0.002
  backcalc_max_tolerance: 0.05

  # 1인평균급여와 (연간급여총액 ÷ 인원) 차이 경고선(%).
  # 크래프톤이 12% 내외로 지속 차이(스톡보상·중도 입퇴사 기준 추정) -> 오류 아님, 기록만.
  salary_gap_warn_pct: 15

  # 근속연수 상세 계산 vs 합계 행 차이 경고선(년).
  # LG전자 2022 가 0.55년 차이(인원은 정확히 일치). 회사가 다르게 계산한 것.
  tenure_gap_warn_years: 0.3

  # [WP-10 예정] 후보 표 행 수 상한.
  # 시프트업 2025 문서는 마크업 파손으로 4,937행짜리 병합 표가 생긴다.
  candidate_table_max_rows: 30

# -------------------------------------------------------- 재무제표 선택 기준
financial_statement:
  # 연결 우선, 없으면 별도. 어느 쪽을 썼는지 fs_div 컬럼에 반드시 기록한다.
  # 삼성전자 2025 매출: CFS 333.6조 vs OFS 238.0조 (95조 차이)
  fs_div_priority: [CFS, OFS]

  # 손익계산서 계열. 회사가 포괄손익계산서(CIS)로 제출하는 경우가 있다.
  income_statement_div: [IS, CIS]

  # 재무상태표. 부채총계·자본총계가 여기서 나온다.
  balance_sheet_div: [BS]

  reprt_code: '11011'   # 사업보고서(연간)
