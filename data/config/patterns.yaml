# 지표 추출 규칙
#
# 회사마다 계정명·라벨·구조가 다르다. 네 지표(매출·영업이익·R&D·직원)의 실패 원인이
# 전부 여기에 있었다. 그래서 "이름으로 찾는" 부분은 전부 이 파일로 뺀다.
#
#   원칙: 커버리지가 안 나오면 코드를 고치지 말고 이 목록을 늘린다.
#
# 값의 근거는 docs/DESIGN.md 4장(실제로 부딪힌 문제와 대응) 참고.
#
# **이 파일의 실측 수치는 수집 캐시 13개사 기준이다** — `.cache/` 에 응답이 있는
# 전부이고, `config/targets.csv` 의 적재 대상 10개사가 아니다. 이름 목록을 늘리는
# 근거는 "받아둔 응답에 어떤 표기가 있나" 이므로 캐시 전체를 세는 것이 맞다.
# 캐시에만 있고 타깃에 없는 3개사는 한미반도체·카카오·네이버로, KSIC 중분류가
# 26·58 밖이라 적재 대상에서 빠졌다.
#
#   실측 기준: 캐시 13개사 x 5년 = 65건 (시프트업 상장 이전 3건 포함)
#   적재 대상: targets.csv 10개사 x 5년 − 상장 이전 3건 = 47건
#
# 표기 규칙
#   names / *_row_names / tokens  : 정확일치 목록. 순서 = 우선순위
#   *_re / exclude                : 정규식 (반드시 작은따옴표로 감쌀 것)

# ---------------------------------------------------------------- 매출액
revenue:
  # 정확일치 + 우선순위 순. 위에서부터 먼저 채택한다.
  # 제조업은 '매출액', 금융·지주·게임사는 '영업수익'으로 온다.
  # '매출'/'수익' 단독은 너무 넓지만 exclude 로 걸러지므로 마지막 순위로만 둔다.
  names:
    - 매출액
    - 영업수익
    - 수익(매출액)
    - 영업수익(매출액)
    - 매출
    - 수익

  # 이름에 '수익'이 들어가지만 매출이 아닌 계정들.
  # 카카오 2021 응답에 기타수익 1.73조 / 금융수익 1,778억 / 이자수익 369억이 함께 왔다.
  exclude: '기타수익|금융수익|이자수익|배당금수익|임대수익|수수료수익|외환|처분이익|평가이익|지분법|법인세|영업외|중단영업|매출원가|매출총이익|매출채권|미수'

  # XBRL 표준계정코드. 단독으로는 신뢰할 수 없다 —
  #   카카오   영업수익 -> ifrs-full_GrossProfit (매출총이익 태그)
  #   크래프톤 영업수익 -> '-표준계정코드 미사용-'
  # 계정명과 병용해 교차검증에 쓴다. (경로 B)
  account_ids:
    - ifrs-full_Revenue
    - ifrs_Revenue
    - ifrs-full_RevenueFromContractsWithCustomers
    - ifrs-full_RevenueFromContractsWithCustomersRecognisedAtPointInTime

  # 전체재무제표(fnlttSinglAcntAll)는 회사 원문 계정명을 그대로 준다.
  # 넷마블 2023~25 = 'Ⅰ.영업수익' 처럼 번호 접두사가 붙어 정확일치가 실패한다.
  # 이 정규화로 경로 C 성공률이 47/50 -> 50/50 이 되었다.
  name_prefix_strip: '^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩIVX\d]+\s*[.．)\]]\s*'

# ------------------------------------------------------------- 영업이익
operating_profit:
  names:
    - 영업이익
    - 영업이익(손실)
    - 영업손익
    - 영업손실
  account_ids:
    - ifrs-full_ProfitLossFromOperatingActivities
    - dart_OperatingIncomeLoss
    - ifrs-full_OperatingIncomeLoss

# ----------------------------------------------------------- 당기순이익
# V7(S15P21A504-97)이 카탈로그에 넣은 기본 지표. 적재는 S15P21A504-121 이다.
net_income:
  # 주요계정(경로 A)은 표기가 하나뿐이다 — 캐시 13개사 236행 전부 '당기순이익(손실)'.
  # 나머지는 전체재무제표(경로 C)의 회사 원문 계정명이고 실측 분포는 이렇다.
  #   87 당기순이익(손실)  45 당기순이익  6 연결당기순이익(손실)
  #    4 당기순이익(손실)(A)   4 Ⅴ.당기순이익(손실)   2 당기순손익
  # 'Ⅴ.' 같은 번호 접두사는 revenue.name_prefix_strip 이 떼어낸다.
  names:
    - 당기순이익(손실)
    - 당기순이익
    - 연결당기순이익(손실)
    - 당기순이익(손실)(A)
    - 당기순손익

  # 경로 B 는 ifrs-full_ProfitLoss **하나만** 쓴다. 이름이 비슷한 아래 계정들은
  # 값이 다르다. 목록에 넣으면 조용히 틀린 값이 들어온다.
  #   ProfitLossBeforeTax                          법인세차감전   108행
  #   ProfitLossAttributableToOwnersOfParent       지배기업 지분   22행
  #   ProfitLossAttributableToNoncontrollingInt…   비지배지분      18행
  #   ProfitLossFromContinuingOperations           계속영업        14행
  account_ids:
    - ifrs-full_ProfitLoss

# ------------------------------------------------------ 부채총계·자본총계
# V7(S15P21A504-97)이 debtRatio(부채총계 / 자본총계) 입력으로 심은 내부 지표다.
# is_active=FALSE 라 화면에 직접 나가지 않는다. 적재는 S15P21A504-121.
#
# **정확일치가 아니면 안 된다.** 전체재무제표에 자산총계를 뜻하는
# ifrs-full_EquityAndLiabilities 가 118행 있고, 그 이름 표기가 8가지다.
#   55 자본과부채총계   27 부채와자본총계   12 부채와 자본 총계   10 부채및자본총계
#    6 자본및부채총계    4 부채 및 자본총계   2 자본과 부채       2 부채 및 자본 총계
# 부분일치로 찾으면 자본총계 자리에 자산총계가 들어간다 — 부채비율이 통째로 틀린다.
#
# 반대 방향도 실측으로 확인했다. 이름이 정확히 '자본총계' 인 602행은 전부
# ifrs-full_Equity 이고 EquityAndLiabilities 를 쓰는 행이 하나도 없다. 그래서
# 정확일치는 놓치는 것 없이 안전하다.
total_liabilities:
  names:
    - 부채총계
  account_ids:
    - ifrs-full_Liabilities

total_equity:
  # 주요계정 118행 중 1행(엔씨소프트 2021 개별)에 자본총계가 없다. DART 가 주지
  # 않은 것이고 수집 실패가 아니다. 연결 우선 규칙 덕분에 채택에는 걸리지 않는다 —
  # 실측 47건 전부 연결에서 값이 나온다. 그래서 자산총계-부채총계 역산은 넣지 않았다.
  # account_id 가 '-표준계정코드 미사용-' 인 행이 1건 있어 경로 C 를 함께 둔다.
  names:
    - 자본총계
  account_ids:
    - ifrs-full_Equity

# ------------------------------------------------------ R&D (사업보고서 원문)
rnd:
  # 후보 표 선정: 섹션 제목이 이 패턴인 표만 본다.
  # 이 제한이 없으면 재무제표 주석의 9,684행짜리 표를 잡는다(NAVER).
  section_title_re: '연구개발'

  # 금액 행. '연구개발비'가 반드시 포함돼야 한다.
  # '합계'/'계' 단독을 허용하면 아무 표의 아무 합계 행이나 걸린다.
  amount_row_re: '연구개발비용?(합계|총계|계)'

  # [WP-10 예정] 시프트업은 금액 행 라벨이 '합계' 단독이다.
  # 표 안에 '연구개발비'가 있을 때만 이 패턴을 추가로 허용한다.
  amount_row_fallback_re: '^(합계|계|소계)$'

  # 비율 행. 분모 이름이 회사마다 다르다.
  #   삼성전자 '연구개발비 / 매출액 비율'  /  NAVER '연구개발비/영업수익 비율'
  # '영업수익'이 빠져 있어 NAVER 5개 연도가 검증 실패 상태였다.
  ratio_row_re: '연구개발비.{0,20}(매출액|영업수익|매출|수익).{0,10}(비율|대비)|(매출액|영업수익|매출)대비.{0,10}연구개발'

  # 표 안에 매출액이 같이 적힌 경우(50건 중 1건, SK하이닉스).
  # 분자·분모가 같은 표라 단위를 몰라도 비율이 정확하다. 교차검증 경로 ①.
  revenue_row_names:
    - 매출액
    - 영업수익
    - 수익(매출액)
    - 매출

  # 금액 행이 아닌 행. '회계처리' 구분(판관비/제조경비/무형자산)과 정부보조금.
  exclude_row_re: '회계처리|무형자산|판매비|제조경비|정부보조|정부출연'

  # 값으로 인정할 셀. 숫자·콤마·소수점·%·괄호·부호·공백만 허용한다.
  # 이게 없으면 라벨 안의 계산식 '...÷당기매출액×100]' 에서 100을 값으로 읽는다.
  numeric_cell_re: '^[\d,.\s%()▲△\-–]+$'

  # DART 자체 마크업의 셀 태그
  cell_tags: [TD, TE, TH]

  # 단위 -> 원 환산 배수. 긴 것부터 검사해야 '백만원'이 '원'으로 오인되지 않는다.
  # 실측 분포: 백만원 31 / 천원 14 / 원 5
  # **순서가 곧 규칙이다.** 코드는 위에서부터 `이름 in 문자열` 로 찾고 첫 일치를
  # 쓴다. '십억원' 이 '억원' 보다 뒤에 있으면 '억원' 이 먼저 걸려 값이 10배 작아진다.
  # SK하이닉스 2024 시설투자표의 단위가 '십억원' 이고, 17,956 을 1.8조(실제 17.96조)로
  # 읽었다 — S15P21A504-73 에서 실측으로 잡았다.
  units:
    - { name: 조원,   multiplier: 1000000000000 }
    - { name: 십억원, multiplier: 1000000000 }
    - { name: 백만원, multiplier: 1000000 }
    - { name: 천원,   multiplier: 1000 }
    - { name: 억원,   multiplier: 100000000 }
    - { name: 원,     multiplier: 1 }

  # 단위 표기는 표 앞 문장이 아니라 직전의 1행 1열 표에 들어있다(50건 중 44건).
  # 자기 표부터 직전 N개까지 거슬러 올라가며 '단위'를 찾는다.
  unit_lookback_tables: 3

  # 거슬러 오르다 **외화 단위표**를 만나면 거기서 멈춘다. 계속 올라가면 남의 표에
  # 붙은 '억원' 을 집어 값이 1억 배가 된다 — SJG세종 2021 시설투자표가 그랬다
  # (직전 표가 '(단위 : 불, 위엔, 유로)' 이고 그 위가 '(단위 : 억원)'). 해외 종속회사
  # 투자라 금액이 위안화인데 240조원으로 읽혔다 (S15P21A504-73 1차 확대에서 실측).
  #
  # 환산율이 없으므로 외화 표는 버린다 — 원화로 바꿀 수 없는 값을 원화 칸에 넣는 것보다
  # 없는 편이 낫다. 버려진 표는 unit_unknown 으로 남아 세어진다.
  #
  # **원화가 같이 적혀 있어도 외화 쪽이 이긴다.** 같은 회사 2024년 표가
  # '(단위 : 불, 위안, 유로, 원)' 인데 행마다 통화가 다르다(북경세종 CNY ·
  # SJG알라바마 USD). 원화로 읽으면 4,123,010원 같은 값이 되어 자릿수 검증(F축)도
  # 통과해버린다 — 조용히 틀리는 모양이라 더 위험하다. 통화가 섞인 표는 곱할 수를
  # 하나로 정할 수 없으므로 버린다.
  foreign_currency_markers: [불, 달러, USD, 위엔, 위안, RMB, CNY, 유로, EUR, JPY, HKD]

  # 연결/별도가 한 표에 섞인 경우(50건 중 10건, NAVER·카카오)
  #   과 목 | 연결 | 연결 | 별도 | 별도
  # 헤더에서 열을 찾아 연결을 우선한다. 순서에 의존하면 조용히 틀린다.
  consolidated_header: 연결
  separate_header: 별도
  header_scan_rows: 3

# ------------------------------------------------------------- 직원 현황
employee:
  # 합계 행 라벨. '성별합계' 라는 표기를 쓴다(삼성전자·엔씨소프트·LG전자).
  # 인원 집계에서 제외하지 않으면 직원수가 2배가 된다.
  total_row_re: '^(성별)?(합계|총계|계)$|^전체$'

  null_tokens: ['', '-', '–', '—', '해당사항 없음', '해당사항없음', 'N/A', '미기재', '없음']

  # 응답 필드명. 문서만 보고 짐작하면 틀린다 —
  # 평균근속은 avrg_cnttk_sdytrn 이 아니라 avrg_cnwk_sdytrn 이다.
  fields:
    segment: fo_bbm
    gender: sexdstn
    regular: rgllbr_co
    contract: cnttk_co
    total: sm
    tenure: avrg_cnwk_sdytrn
    salary_per_person: jan_salary_am
    salary_total: fyer_salary_totamt

# ------------------------------------------------------------- 판정 임계값
# 감으로 정한 값이 아니다. 근거를 함께 남긴다.
thresholds:
  # R&D 비율 교차검증 허용 오차(%p).
  # 근거: high 41건 중 최대 오차가 엔씨소프트 0.43%p.
  #       보고서가 비율을 정수로 반올림해 적기 때문(계산 21.58% -> 보고 '22%').
  rnd_ratio_tolerance_pp: 0.5

  # R&D 비율 상식 범위(%). 벗어나면 단위 오인을 의심한다.
  rnd_ratio_min_pct: 0.0
  rnd_ratio_max_pct: 60.0

  # 매출 경로(A·B·C) 간 허용 상대오차. 같은 값을 다른 방법으로 찾은 것이므로 엄격하게.
  # 실측: 겹치는 43건 전부 오차 0.00%
  revenue_path_tolerance: 0.005

  # R&D 역산 매출(경로 D)은 회사가 어떤 분모를 썼는지 모르므로 보조 증거로만 쓴다.
  # API 경로가 2개 이상이면 판정에서 제외. 1개뿐일 때만 대조 상대로 사용.
  # 허용오차는 보고비율의 표기 자릿수에서 계산한다:
  #   '19%'   -> 반올림 ±0.5%p  -> 매출 역산 ±2.6% 허용
  #   '18.5%' -> 반올림 ±0.05%p -> 매출 역산 ±0.27% 허용
  backcalc_extra_margin: 0.002
  backcalc_max_tolerance: 0.05

  # 1인평균급여와 (연간급여총액 ÷ 인원) 차이 경고선(%).
  # 크래프톤이 12% 내외로 지속 차이(스톡보상·중도 입퇴사 기준 추정) -> 오류 아님, 기록만.
  salary_gap_warn_pct: 15

  # 근속연수 상세 계산 vs 합계 행 차이 경고선(년).
  # LG전자 2022 가 0.55년 차이(인원은 정확히 일치). 회사가 다르게 계산한 것.
  tenure_gap_warn_years: 0.3

  # [WP-10 예정] 후보 표 행 수 상한.
  # 시프트업 2025 문서는 마크업 파손으로 4,937행짜리 병합 표가 생긴다.
  candidate_table_max_rows: 30

  # 부문별 매출 합계 vs DART 매출 허용 상대오차 (S15P21A504-73).
  # 부문 합계는 전사 매출과 같아야 한다. 어긋나면 열을 잘못 집었거나(셀 밀림)
  # 합계 행을 부문으로 셌다는 뜻이라, 이 대조가 유일한 안전장치다.
  # 5%: 회사가 부문 매출을 내부거래 제거 전 기준으로 적는 경우가 있어 정확일치는
  # 못 쓴다. 삼성전자 2024 는 '기타(부문간 내부거래 제거)' 행이 따로 있어 0% 다.
  segment_sum_tolerance: 0.05

# -------------------------------------------------------- 재무제표 선택 기준
financial_statement:
  # 연결 우선, 없으면 별도. 어느 쪽을 썼는지 fs_div 컬럼에 반드시 기록한다.
  # 삼성전자 2025 매출: CFS 333.6조 vs OFS 238.0조 (95조 차이)
  fs_div_priority: [CFS, OFS]

  # 손익계산서 계열. 회사가 포괄손익계산서(CIS)로 제출하는 경우가 있다.
  income_statement_div: [IS, CIS]

  # 재무상태표. 부채총계·자본총계가 여기서 나온다.
  balance_sheet_div: [BS]

  reprt_code: '11011'   # 사업보고서(연간)

# ------------------------------------------- 사업보고서 (S15P21A504-73)
# DART 정형 API 로 못 얻는 값만 여기서 뽑는다. 겹치면 API 가 우선이다.
business_report:

  # ── 부문별 매출 → segment_metric.segment_revenue ──────────────────
  segment:
    # 후보 표를 이 섹션들로 좁힌다. 제한이 없으면 재무제표 주석의
    # 수천 행짜리 표를 잡는다 (rnd 쪽이 NAVER 9,684행으로 겪은 문제).
    section_title_re: '매출\s*및\s*수주|주요\s*제품\s*및\s*서비스|사업의\s*개요|부문별\s*보고'

    # 표 안에 이 말이 있어야 부문 매출표로 본다.
    table_hint_re: '매출실적|부문별|사업부문|서비스별|영업수익|부\s*문'

    # 부문 이름이 아닌 행. 이걸 빼지 않으면 합계가 부문으로 들어가 두 배가 된다.
    #   삼성전자 '합 계'(공백 포함) · NAVER 첫 행 '영업수익'(전사 합계)
    # 소계 표기가 '부문 계' 처럼 앞에 말이 붙어 온다. 삼성전자 2021 은 DS부문을
    # 반도체/DP/기타 세 행으로 쪼개고 '부문 계' 행을 따로 두는데, 그 행을 부문으로
    # 세면 DS부문이 두 번 더해져 합이 44.7% 어긋난다.
    # '기계' 처럼 정상 이름이 '계' 로 끝나는 경우를 지우지 않으려고, 앞에 올 수 있는
    # 말을 (부문|사업부문|영업부문|합|총|소|중) 으로 한정한다.
    #
    # **'…합계' 로 끝나는 이름도 뺀다.** OCI 2025 부문표는 부문 네 행 뒤에
    # '매출액 합계' 와 '연결 후 매출액 합계' 를 따로 두는데, 앞에 말이 붙어 있어
    # 위 '계' 규칙에 안 걸린다. 그대로 두면 합이 매출의 3.1배가 된다.
    # '계' 한 글자와 달리 **'합계' 두 글자로 끝나는 정상 부문 이름은 없다.**
    exclude_row_re: '^[-\s]*(부문|사업부문|영업부문)?\s*(합|총|소|중)?\s*계\s*$|합\s*계\s*$|^[-\s]*(영업수익|매출액|매출|수익|전사|internal|기타매출)\s*$|내부거래|연결조정|조정|제거'

    # **부문이 아니라 재무상태표 항목인 행.** 같은 섹션에 '부문별 자산·부채' 표가
    # 함께 오는 회사가 있다. OCI 2025 가 그렇다 —
    #   구분   | 2024.12.31. | …          ← 헤더 아랫단
    #   총자산 | 1,133,611,456 | …
    #   유형자산 | 383,146,119 | …
    #   총부채 | 553,493,888 | …
    # 이 표가 부문 매출표로 뽑혔는데 **첫 열 합(2.07조)이 매출(2.14조)과 3.2%
    # 차이라 합계 대조를 그냥 통과했다.** 우연이다. 합계 대조는 스칼라 하나만 보므로
    # 이런 표를 가려내지 못한다 — 행 이름으로 막는 수밖에 없다.
    # develop 시드에 이미 18행(5 기업-연도)이 전부 verified 로 들어가 있다.
    #
    # **완전일치로만 건다.** '자산관리 사업' 같은 진짜 부문 이름을 지우면 안 된다.
    # 뒤에 붙는 주석 표기('총자산 (주1)')만 허용한다.
    balance_sheet_row_re: '^(구\s*분|총\s*자산|자산\s*총계|총\s*부채|부채\s*총계|자본\s*총계|자기\s*자본|유형\s*자산|무형\s*자산|재고\s*자산|매출\s*채권|감가\s*상각비|자본적\s*지출|종업원\s*수)(\s*[(（].{0,10}[)）])?$'

    # 부문 이름 앞에 붙는 장식. NAVER 가 '- 서치플랫폼' 으로 적는다.
    name_strip_re: '^[\-ㆍ·•\s]+|[\s]+$'

    # 라벨 셋(앞 3열) 어디에든 이 말이 있으면 매출 행이 아니다.
    # 현대차 2024 는 한 부문을 두 행으로 적는다 —
    #   차량부문 | 자동차 등 | 매출액   | 136,725,011 | ...
    #   차량부문 | 자동차 등 | 영업이익 |  11,411,499 | ...
    # 0열만 보면 이름이 같아 둘이 합쳐져 매출이 영업이익만큼 부풀어 오른다.
    #
    # **손익 항목만 넣는다.** '내부거래' 를 넣었더니 삼성전자 2024 의 정당한
    # 부문 행 '기타 | 부문간 내부거래 제거 등 | △285,155' 가 지워져 합계가
    # 9.5% 어긋났고, 파서가 부문표(idx=39) 대신 매출유형표(idx=71,
    # 제ㆍ상품/용역)를 골랐다. 합계는 맞아서 verified 로 보이는 오답이었다.
    exclude_cell_re: '영업이익|영업손실|영업손익|당기순이익|당기순손실'

    # 부문 이름으로 인정하지 않는 값. 숫자만 있거나 너무 길면 라벨이 아니다.
    name_max_len: 100

    # 값 열 선택 — **행 안에서 첫 번째 숫자 셀**을 당기 값으로 본다.
    # 절대 열 번호를 쓰면 셀이 한 칸 밀린 행에서 조용히 틀린다. 크래프톤 2024 의
    # '기타' 행이 구분 셀 없이 [기타, 17176, ...] 로 와서 다른 연도 값을 집는다.
    # 행 기준으로 세면 밀림과 무관하게 같은 자리를 집는다 (실측 3개사 확인).
    value_position: 0

  # ── 시설투자 → company_activity.activity_type='facility' ──────────
  facility:
    section_title_re: '원재료\s*및\s*생산설비|생산\s*및\s*설비|사업의\s*내용'
    table_hint_re: '설비.{0,6}(신설|매입|증설|투자)|투자\s*계획|시설\s*투자|신규\s*시설|생산설비.{0,6}(현황|투자)'

    # 금액이 아닌 행
    exclude_row_re: '^[-\s]*(합\s*계|총\s*계|소\s*계|계)\s*$'

    # 항목·목적 자리에 **투자기간**이 들어온 행. 열이 밀렸다는 뜻이라 금액도 못 믿는다.
    # 한국전력공사가 해마다 한 행씩 이렇게 온다 —
    #   purpose="2024.06 ~ 2027.12", amount=47 (백만원)
    # 금액만 보면 4,700만원이라 그럴듯해 보여서 눈으로는 안 걸린다. 행을 버린다.
    #
    # **항목 자리에도 같은 검사를 건다.** 한 칸 더 밀리면 기간이 항목으로 온다 —
    # GS 2022 가 '2022년 06월 ~ 2028년 12월' 을 항목으로 1조 1,707억을 달고 왔다.
    # 샘표·SK가스·케이씨씨글라스도 같은 모양이다 (전수 비교에서 21행).
    # 항목 칸이 **연도로 시작하면 기간 라벨이다.** 위 규칙은 '2021.01 ~ 2021.12' 같은
    # 점 표기만 잡는데, GS 는 '2022년 06월 ~ 2028년 12월' 로, 한화갤러리아는
    # '2025년 상반기' 로, 에이피알은 '2024년~' 로 적는다. 전부 항목 칸에 온 기간이고
    # 금액은 옆 열에서 밀려온 값이라 못 믿는다 (전수 비교 21행).
    # 투자 자산 이름이 연도로 시작하는 경우는 없다.
    period_field_re: '^(19|20)\d{2}\s*[년.\-/~∼〜–]'

    period_cell_re: '\d{2,4}\s*[.\-/]\s*\d{1,2}\s*[~∼〜–-]\s*.{0,3}\d{2,4}\s*[.\-/]\s*\d{1,2}'

    # 열 이름으로 찾는다. 표마다 열 순서가 다르다 (실측 2개사).
    #   삼성전자   구 분 | 내 용      | 투자기간 | 대상자산 | 투자액
    #   SK하이닉스 구분  | 투자대상자산 | 투자효과 | 투자 기간 | 기투자액(누적) | 비고
    #
    # **투자액 열이 있어야 시설투자표로 본다.** 같은 섹션에 원재료 매입액표·
    # 유형자산 변동표(기초/증감/상각/기말)·가동률표가 함께 있어서, 금액 열을
    # '금액|당기' 처럼 넓게 잡으면 그것들이 전부 걸린다. 현대차 2024 의 유형자산
    # 변동표가 실제로 그렇게 걸렸다.
    field_header_re: '^구\s*분$|사업\s*부문|^부\s*문$|투자\s*대상|대상\s*자산'
    purpose_header_re: '내\s*용|투자\s*효과|목\s*적|용\s*도|^효\s*과$'

    # **금액 열만으로는 시설투자표로 인정하지 않는다.** 항목 열이나 목적 열 중
    # 하나는 있어야 한다. 이지홀딩스 2022 는 'II. 사업의 내용' 장의 계열사 현황표
    # (사업부문|주요사업|주요회사명)가 금액 열 하나만 걸려 시설투자표로 뽑혔고,
    # 거기 섞인 잡숫자가 1원·2원짜리 설비투자가 됐다. 정상 표는 전부 둘 중 하나가
    # 있다 — 삼성전자 '구분' · SK하이닉스 '투자대상자산' · 신풍제약 '내용'.
    require_field_or_purpose: true

    # **금액 칸이 숫자가 아닌 표를 통째로 버리는 규칙은 넣지 않는다.** TYM 2021 처럼
    # 열이 한 칸 어긋난 표를 지우려고 "금액 칸이 숫자인 행 비율 50% 미만이면 버린다"
    # 를 넣어 전수 비교(문서 3,832건)를 돌렸더니 **38개 문서가 멀쩡한 값을 잃었다** —
    # 케이씨씨 2024 '기타' 408억, 동국홀딩스 '수리 등' 24억, 두산 '디지털이노베이션BU'
    # 166억. 자산형태 칸이 섞인 표라도 숫자인 행은 제 값이었다. 고치는 1행보다
    # 잃는 38건이 크다. TYM 은 F축이 잡으므로 검증에 맡긴다 (신풍제약과 같은 판단).

    # 금액 열은 **우선순위로 고른다.** 첫 일치를 쓰면 틀린 열을 집는다 —
    # LS 2023 표가 `총소요자금 | 기지출금액 | 향후투자액` 인데 '투자액' 이
    # 향후투자액에 걸려 남은 투자액(61백만원)을 투자 금액으로 읽었다.
    # 위에서부터 찾고 걸리는 순간 멈춘다.
    amount_header_priority_re:
      - '총\s*소요\s*자금|총\s*투자\s*(액|금액)?|투자\s*총액'   # 총액이 있으면 그것
      - '^투자\s*액$|^투자\s*금액$|투자\s*규모'                  # 없으면 당기 투자액
      - '기투자액|기\s*지출\s*금액|기\s*투자'                    # 그것도 없으면 누적 집행액

    # 이 말이 든 열은 금액으로 쓰지 않는다. 아직 안 쓴 돈이다.
    amount_exclude_header_re: '향\s*후|잔\s*여|미집행|예\s*정'

    # 2단·3단 헤더의 아랫단. 병합 셀이 펼쳐지지 않아 **윗단만 헤더로 잡히고
    # 아랫단이 데이터 행으로 남는다.** 하이트진로 2023 표가
    #   [0] 사업부문 | 계획명칭 | 예상투자총액 | 연도별 예상투자액 | 투자효과 | 비고
    #   [1] 자산형태 | 금액     | 2023년       | 2024년            | 이후
    # 이라 '자산형태' 가 항목이 되고 금액 자리의 '2023년' 이 2,023억원이 됐다.
    #
    # **단위가 억원·백만원이면 자릿수까지 그럴듯해서 F축이 못 잡는다** — 1차 확대
    # 때 이미 25행(합계 2.3조원)이 develop 시드에 들어갔다. 값이 작아지는
    # 천원·원 표에서만 F축에 걸려 2차에서 드러났다.
    #
    # HS효성첨단소재는 '구분|투자금액' 밑에 '구분|2025년 1~12월' 이 오고 그 밑에
    # 다시 '(실적)|(계획)' 이 와서 한 단 더 있다. 그래서 한 행만이 아니라
    # 연달아 걷어낸다.
    #
    # **연도로 시작하면 뒤에 무엇이 붙든 기간 라벨로 본다.** 처음에
    # '2024년 1~12월' 만 잡았더니 효성이 같은 표를 '2024년 연간(실적)' 으로 적어
    # 안 걸렸다. 그 바람에 걷어낸 표(tbl 170)보다 못 걷어낸 표(tbl 214)의 행이
    # 많아져 **표 선택까지 뒤집혔다** — 20억이던 가짜가 2,024억이 됐다.
    # 투자 항목 이름이 연도로 시작하는 경우는 없다.
    # '제47기' 같은 기수 표기도 같은 자리에 온다 (남선알미늄).
    # 한전KPS 는 연도를 `'22` 로 줄여 적는다 — 22 가 금액으로 읽혔다.
    subheader_cell_re: '^(자산\s*형태|자산\s*구분|자산별|금\s*액|수\s*량|구\s*분|내\s*용|계획\s*명칭|투자\s*효과|비\s*고|이\s*후|기\s*타|합\s*계|20\d{2}\s*[년.\-/]?.*|제\s*\d{1,3}\s*기.*|[\x27’]\s*\d{2}\s*년?|\(?\s*(실적|계획|예정|누적|전망)\s*\)?)$'

    # **금액 칸 안에 단위가 직접 붙어 오는 표.** 대덕 2024 는 총투자액을
    # '2,700억원' 으로, 삼보판지는 '335 억원' 으로, 강원랜드는 '199억원' 으로 적는다.
    # 이때 표 바깥에서 찾은 단위(대덕은 직전표-2 의 '단위: 원')를 쓰면 2,700원이
    # 된다 — 실제로 F축에 7행이 이렇게 걸렸다.
    #
    # **셀이 직접 말하는 단위가 표 단위를 이긴다.** 표 단위는 칸에 단위가 없을 때
    # 쓰는 기본값이고, 칸에 적혀 있으면 그것이 그 칸의 사실이다.
    # 숫자 바로 뒤에 붙은 것만 본다 — 목적·비고에 든 '억원' 을 집으면 안 된다.
    cell_unit_re: '[\d,.]\s*(조원|십억원|백만원|천원|억원|원)'

    # 원화가 아닌 금액. 환산은 추정이므로 하지 않고 행을 버린다
    # (build_metric_seed 의 통화 규칙과 같다). 효성티앤씨는 해외 종속회사
    # 설비투자를 '$15백만' 으로 적는다 — $ 를 떼면 15가 남아 15원이 된다.
    foreign_currency_re: '[$€¥£]|USD|EUR|JPY|CNY|달러|위안|엔화'

  # ── company_text 6종 ─────────────────────────────────────────────
  # 규칙 파싱으로 되는 둘만 여기서 뽑는다. 나머지 넷은 의미 해석이라 LLM 이다
  # (팀장 기준 5항).
  text:
    main_business_section_re: '사업의\s*개요|회사의\s*개요'
    main_product_section_re: '주요\s*제품\s*및\s*서비스'
    rd_section_re: '연구개발'

    # LLM 에 넘길 구간을 자를 때 쓰는 상한. 서버 컨텍스트가 12,288 토큰이고
    # 한국어는 대략 1.5자/토큰이라 입력을 6,000자로 자른다. 출력 여유를 남긴다.
    llm_input_chars: 6000

    # 값으로 인정하지 않는 문구
    null_tokens_re: '^(해당\s*사항\s*없음|해당사항없음|없음|N/A|-|미기재)$'

    # 제품이 아닌 값. **행 라벨이 아니라 뽑아낸 항목 자체에 건다.**
    # 삼성전자 부문표가 `기타 | 부문간 내부거래 제거 등 | △285,155` 인데, 첫 칸이
    # '기타' 라 행 단위 제외를 통과하고 제품 칸의 '부문간 내부거래 제거' 가 제품으로
    # 들어갔다 (실측 4,052개 중 77개).
    #
    # '기타'·'계' 는 **단독일 때만** 뺀다. '기타 전자부품' 같은 실제 품목을 지우면
    # 안 된다.
    product_exclude_re: '내부거래|제거|합\s*계|소\s*계$|^계$|^기타$|^기타매출$|^그\s*외$|^미분류$'
