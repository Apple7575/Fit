# 확인을 마친 정합성 발견 사항 (S15P21A504-86)
#
# 여기 등록된 것은 `verify_source.py` 가 실패로 세지 않는다. **숨기는 것이 아니라
# "이미 확인했고 사유를 안다"고 표시하는 것**이다. 실행할 때마다 목록에 계속 출력된다.
#
# 왜 이렇게 하나
#   늘 빨간불인 검사는 사람이 무시하게 된다. 그러면 새 문제가 생겨도 못 알아챈다.
#   알려진 것을 등록해두면 **새로 생긴 것만 실패**하므로 신호가 살아 있다.
#
# 등록 기준 — 셋 다 충족해야 한다
#   1. 원인을 안다
#   2. 우리가 고칠 수 없거나, 고치지 않기로 결정했다
#   3. 그 결정의 근거가 문서에 있다
#
# 원인을 모르는 것은 등록하지 마라. 그건 아직 조사할 대상이다.

contradictions:
  - id: ncsoft-2024-emp-duplicate
    axis: C
    corp_name: 엔씨소프트
    corp_code: "00261443"
    year: 2024
    what: 착지 테이블 상세 합 2,992 vs 지표 3,832 (차 840명)
    cause: |
      DART 원천 데이터 오류. empSttus 응답에 '연구개발/남'이 두 번 나오고
      두 번째 행(840명)은 성별이 '여'여야 한다. 합계 행으로 검산하면 명백하다.
        남 상세 합  104 + 505 + 1,968 = 2,577 = 성별합계 남
        여 상세 합   49 + 366 +   840 = 1,255 = 성별합계 여
      dart_employee_status 의 UNIQUE 키가 (corp_code, bsns_year, reprt_code,
      fo_bbm, sexdstn) 라 두 행을 구분할 수 없어 뒤 행이 빠졌다.
    why_not_fixed: |
      회사명으로 분기하는 코드는 금지이고, 값을 임의로 바꾸는 것은 더 나쁘다.
      지표 값에는 영향이 없다 — 정규화는 캐시를 직접 읽고 상세 행을 전부 더하므로
      3,832명이 정확히 나온다. 어긋나는 것은 착지 테이블 합계뿐이다.
    ticket: S15P21A504-86
    ref: data/docs/HANDOFF.md 6-3

  - id: estpharm-2022-cfs-asset-gap
    axis: F-1
    corp_name: 에스티팜
    corp_code: "00871833"
    year: 2022
    what: 연결 자산총계 578,679,154,922 vs 부채+자본 570,652,265,120 (차 80.3억 · 1.39%)
    cause: |
      회사 공시(XBRL) 자체의 불일치다. 우리 파싱이 아니라는 근거가 넷이다.

        (1) staged 값이 API 응답과 한 자리도 다르지 않다
        (2) 부분합이 양쪽 다 맞는다 — 유동+비유동 = 자산총계,
            유동부채+비유동부채 = 부채총계, 지배지분+비지배지분 = 자본총계
        (3) DART 가 스스로 계산한 `자본과부채총계` 행도 570,652,265,120 이다.
            응답 안에서 자산총계만 혼자 다르다
        (4) 같은 해 별도(OFS)는 555,145,839,726 으로 정확히 일치한다

      차이 금액이 `당기손익-공정가치측정 금융자산` 8,026,889,802 원과 1원까지 같고,
      전체 계정 응답에 그 행이 두 번 나온다(둘 다 표준계정코드 미사용). 자산 쪽에서
      한 번 더 세어진 것으로 보인다.

      이듬해 공시가 바로잡았다 — 2023 사업보고서의 전기(2022) 비교값은 차이 0 이다.
    why_not_fixed: |
      원천 공시 값을 우리가 고치지 않는다. 고치면 DART 와 대조가 불가능해지고
      무엇을 바꿨는지 되짚을 수 없다. 2022 연결 자산총계를 쓰는 화면이 있다면
      1.39% 과대 표시된다는 것을 알고 쓰면 된다.
    ticket: S15P21A504-86
    ref: data/docs/S15P21A504-86.md

  - id: sejongmedical-2023-ofs-asset-gap
    axis: F-1
    corp_name: 세종메디칼
    corp_code: "00959229"
    year: 2023
    what: 별도 자산총계 108,140,701,071 vs 부채+자본 101,200,695,928 (차 69.4억 · 6.42%)
    cause: |
      회사 공시(XBRL) 자체의 불일치다. 위와 같은 근거에 방향만 반대다 —
      연결(CFS)은 108,461,733,249 로 정확히 일치하고 별도(OFS)만 어긋난다.

        자산  유동 11,455,187,270 + 비유동 96,685,513,801 = 108,140,701,071
        부채  유동 81,355,750,436 + 비유동  8,422,749,269 =  89,778,499,705
        자본  자본금·자본잉여금·기타자본·기타포괄·이익잉여금 합 = 11,422,196,223
        DART 의 `자본과부채총계` 행 = 101,200,695,928

      세 덩어리가 각각 내부적으로는 완벽히 맞는데 양변이 안 맞는다. 차이와 같은
      금액의 계정이 없어서 어느 줄이 틀렸는지는 이 응답만으로 가릴 수 없다.

      이듬해 공시가 바로잡았다 — 2024 사업보고서의 전기(2023) 비교값은 차이 0 이다.
      전기(2022) 비교값도 원래 차이 0 이었다. 2023 그 해만 어긋난다.
    why_not_fixed: |
      위와 같다. 어느 줄이 틀렸는지 모르는 채로 값을 만지면 틀린 값을 새로 만드는 것이다.
      바로잡힌 값이 필요하면 2024 공시의 전기 비교값을 쓰면 된다 — 우리 수집은
      사업연도별 당기 값만 담으므로 거기에는 없다.
    ticket: S15P21A504-86
    ref: data/docs/S15P21A504-86.md

# 차이(임계 초과)는 애초에 실패로 세지 않는다. 회사 기재 방식 차이일 수 있어서다.
# 아래는 기록용이며 verify_source.py 의 판정에 쓰이지 않는다.
#   크래프톤 average_salary   지속 12~17%   스톡보상·중도 입퇴사 기준 차이로 추정
#   NHN 2022 average_salary   18~23%
#   한미반도체 R&D 비율        회사가 다른 분모를 씀
#   LG전자 2022 근속          회사가 다르게 집계
# 근거: data/docs/DESIGN.md 4-5장

  # ── 전 종목 재무 수치 (fnlttMultiAcnt) ──────────────────────────
  # 등록한 둘은 자산총계 한 값만 틀렸다는 것이 **두 독립 합의 일치로 확정**된다.
  #   유동 + 비유동  =  부채총계 + 자본총계   ← 둘이 서로 같은데
  #   자산총계만 다르다                       ← 이 값만 오기라는 뜻
  # 세종메디칼·에스티팜은 자산총계가 맞고 부채+자본이 부족하다. 원인을 모르므로
  # 등록하지 않았다 — 조사 대상이다.

  - id: wooritech-2025-total-assets-digit
    axis: F-1
    corp_name: 우리기술투자
    corp_code: "00231664"
    year: 2025
    what: 별도 자산총계 93,461,548,964 vs 부채+자본 934,615,489,641 (차 8,411억 · 900%)
    cause: |
      DART 원천 데이터 오류. 자산총계에서 자릿수가 하나 빠졌다.
        유동자산 32,554,159,980 + 비유동자산 902,061,329,661 = 934,615,489,641
        부채총계 160,234,605,816 + 자본총계 774,380,883,825 = 934,615,489,641
      두 합이 서로 정확히 일치하는데 자산총계만 그 값의 1/10 이다.
      따라서 틀린 값은 자산총계 하나로 확정된다.
    why_not_fixed: |
      원천 값을 고치지 않는다 (S15P21A504-85 지시서 9장). 회사명으로 분기하는
      코드는 금지이고, 자릿수를 추정해 채우면 다음 수집에서 조용히 사라진다.
      착지 테이블은 원본 그대로 담고 소비처가 F-1 로 거른다.
    ticket: S15P21A504
    ref: data/docs/FINANCIALS_LANDING_PROPOSAL.md

