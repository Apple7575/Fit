# 확인을 마친 정합성 발견 사항 (S15P21A504-86)
#
# 여기 등록된 것은 `verify_source.py` 가 실패로 세지 않는다. **숨기는 것이 아니라
# "이미 확인했고 사유를 안다"고 표시하는 것**이다. 실행할 때마다 목록에 계속 출력된다.
#
# 왜 이렇게 하나
#   늘 빨간불인 검사는 사람이 무시하게 된다. 그러면 새 문제가 생겨도 못 알아챈다.
#   알려진 것을 등록해두면 **새로 생긴 것만 실패**하므로 신호가 살아 있다.
#
# 등록 기준 — 셋 다 충족해야 한다
#   1. 원인을 안다
#   2. 우리가 고칠 수 없거나, 고치지 않기로 결정했다
#   3. 그 결정의 근거가 문서에 있다
#
# 원인을 모르는 것은 등록하지 마라. 그건 아직 조사할 대상이다.

contradictions:
  - id: ncsoft-2024-emp-duplicate
    axis: C
    corp_name: 엔씨소프트
    corp_code: "00261443"
    year: 2024
    what: 착지 테이블 상세 합 2,992 vs 지표 3,832 (차 840명)
    cause: |
      DART 원천 데이터 오류. empSttus 응답에 '연구개발/남'이 두 번 나오고
      두 번째 행(840명)은 성별이 '여'여야 한다. 합계 행으로 검산하면 명백하다.
        남 상세 합  104 + 505 + 1,968 = 2,577 = 성별합계 남
        여 상세 합   49 + 366 +   840 = 1,255 = 성별합계 여
      dart_employee_status 의 UNIQUE 키가 (corp_code, bsns_year, reprt_code,
      fo_bbm, sexdstn) 라 두 행을 구분할 수 없어 뒤 행이 빠졌다.
    why_not_fixed: |
      회사명으로 분기하는 코드는 금지이고, 값을 임의로 바꾸는 것은 더 나쁘다.
      지표 값에는 영향이 없다 — 정규화는 캐시를 직접 읽고 상세 행을 전부 더하므로
      3,832명이 정확히 나온다. 어긋나는 것은 착지 테이블 합계뿐이다.
    ticket: S15P21A504-86
    ref: data/docs/HANDOFF.md 6-3

# 차이(임계 초과)는 애초에 실패로 세지 않는다. 회사 기재 방식 차이일 수 있어서다.
# 아래는 기록용이며 verify_source.py 의 판정에 쓰이지 않는다.
#   크래프톤 average_salary   지속 12~17%   스톡보상·중도 입퇴사 기준 차이로 추정
#   NHN 2022 average_salary   18~23%
#   한미반도체 R&D 비율        회사가 다른 분모를 씀
#   LG전자 2022 근속          회사가 다르게 집계
# 근거: data/docs/DESIGN.md 4-5장

  # ── 전 종목 재무 수치 (fnlttMultiAcnt) ──────────────────────────
  # 등록한 둘은 자산총계 한 값만 틀렸다는 것이 **두 독립 합의 일치로 확정**된다.
  #   유동 + 비유동  =  부채총계 + 자본총계   ← 둘이 서로 같은데
  #   자산총계만 다르다                       ← 이 값만 오기라는 뜻
  # 세종메디칼·에스티팜은 자산총계가 맞고 부채+자본이 부족하다. 원인을 모르므로
  # 등록하지 않았다 — 조사 대상이다.

  - id: wooritech-2025-total-assets-digit
    axis: F-1
    corp_name: 우리기술투자
    corp_code: "00231664"
    year: 2025
    what: 별도 자산총계 93,461,548,964 vs 부채+자본 934,615,489,641 (차 8,411억 · 900%)
    cause: |
      DART 원천 데이터 오류. 자산총계에서 자릿수가 하나 빠졌다.
        유동자산 32,554,159,980 + 비유동자산 902,061,329,661 = 934,615,489,641
        부채총계 160,234,605,816 + 자본총계 774,380,883,825 = 934,615,489,641
      두 합이 서로 정확히 일치하는데 자산총계만 그 값의 1/10 이다.
      따라서 틀린 값은 자산총계 하나로 확정된다.
    why_not_fixed: |
      원천 값을 고치지 않는다 (S15P21A504-85 지시서 9장). 회사명으로 분기하는
      코드는 금지이고, 자릿수를 추정해 채우면 다음 수집에서 조용히 사라진다.
      착지 테이블은 원본 그대로 담고 소비처가 F-1 로 거른다.
    ticket: S15P21A504
    ref: data/docs/FINANCIALS_LANDING_PROPOSAL.md

  - id: shinyoung-spac10-2024-total-assets
    axis: F-1
    corp_name: 신영스팩10호
    corp_code: "01796858"
    year: 2024
    what: 별도 자산총계 11,075,529,055 vs 부채+자본 11,107,529,055 (차 3,200만 · 0.29%)
    cause: |
      DART 원천 데이터 오류. 위와 같은 모양이다.
        유동자산 1,957,529,055 + 비유동자산 9,150,000,000 = 11,107,529,055
        부채총계 1,550,309,200 + 자본총계 9,557,219,855 = 11,107,529,055
      두 합이 일치하고 자산총계만 32,000,000 적다.
    why_not_fixed: |
      위와 같다. 스팩이라 계정이 단순해 다른 해석의 여지가 없다.
    ticket: S15P21A504
    ref: data/docs/FINANCIALS_LANDING_PROPOSAL.md
