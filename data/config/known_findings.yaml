# 확인을 마친 정합성 발견 사항 (S15P21A504-86)
#
# 여기 등록된 것은 `verify_source.py` 가 실패로 세지 않는다. **숨기는 것이 아니라
# "이미 확인했고 사유를 안다"고 표시하는 것**이다. 실행할 때마다 목록에 계속 출력된다.
#
# 왜 이렇게 하나
#   늘 빨간불인 검사는 사람이 무시하게 된다. 그러면 새 문제가 생겨도 못 알아챈다.
#   알려진 것을 등록해두면 **새로 생긴 것만 실패**하므로 신호가 살아 있다.
#
# 등록 기준 — 셋 다 충족해야 한다
#   1. 원인을 안다
#   2. 우리가 고칠 수 없거나, 고치지 않기로 결정했다
#   3. 그 결정의 근거가 문서에 있다
#
# 원인을 모르는 것은 등록하지 마라. 그건 아직 조사할 대상이다.

contradictions:
  - id: ncsoft-2024-emp-duplicate
    axis: C
    corp_name: 엔씨소프트
    corp_code: "00261443"
    year: 2024
    what: 착지 테이블 상세 합 2,992 vs 지표 3,832 (차 840명)
    cause: |
      DART 원천 데이터 오류. empSttus 응답에 '연구개발/남'이 두 번 나오고
      두 번째 행(840명)은 성별이 '여'여야 한다. 합계 행으로 검산하면 명백하다.
        남 상세 합  104 + 505 + 1,968 = 2,577 = 성별합계 남
        여 상세 합   49 + 366 +   840 = 1,255 = 성별합계 여
      dart_employee_status 의 UNIQUE 키가 (corp_code, bsns_year, reprt_code,
      fo_bbm, sexdstn) 라 두 행을 구분할 수 없어 뒤 행이 빠졌다.
    why_not_fixed: |
      회사명으로 분기하는 코드는 금지이고, 값을 임의로 바꾸는 것은 더 나쁘다.
      지표 값에는 영향이 없다 — 정규화는 캐시를 직접 읽고 상세 행을 전부 더하므로
      3,832명이 정확히 나온다. 어긋나는 것은 착지 테이블 합계뿐이다.
    ticket: S15P21A504-86
    ref: data/docs/HANDOFF.md 6-3

