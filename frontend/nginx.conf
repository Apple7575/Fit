server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 앞단 프록시가 없는 로컬 실행용. prod/dev 는 proxy 가 /api/ 를 먼저 가져간다.
    # 변수를 쓰지 않으면 backend 가 늦게 뜰 때 nginx 가 기동에 실패한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend;

    client_max_body_size 20m;

    location /api/job-postings {
        proxy_pass http://$backend_upstream:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # 면접 AI(vLLM/Qwen)도 응답이 느리다.
    location /api/interviews {
        proxy_pass http://$backend_upstream:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://$backend_upstream:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
