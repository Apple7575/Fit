# 단위 테스트는 DB 없이 컨텍스트 구성만 확인한다.
# CI 의 backend 스테이지는 docker 소켓 없이 도는 컨테이너라 실제 DB 를 띄울 수 없다.
# DB 를 실제로 붙이는 통합 테스트는 F-36 에서 별도로 다룬다.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.datasource.url=jdbc:postgresql://localhost:5432/unused
spring.datasource.username=test
spring.datasource.password=test

# 이 파일은 main 의 application.properties 를 병합하지 않고 통째로 가린다
# (classpath 에서 같은 이름 중 test 쪽이 먼저 잡힌다).
# 따라서 @Value 로 기본값 없이 읽는 키는 여기에도 있어야 컨텍스트가 뜬다.
app.mail.from=no-reply@test.local
app.frontend-base-url=http://localhost:5173
app.verification.token-ttl=24h

app.remember-me.key=test-remember-me-key
app.remember-me.validity=14d
app.remember-me.secure=false
