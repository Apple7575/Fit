# 로컬 실행용. infra/docker-compose.yml 의 postgres 가 127.0.0.1:5432 에 열려 있다.
# 비밀번호는 저장소에 두지 않고 환경변수에서 읽는다.
#   PowerShell: $env:POSTGRES_PASSWORD="..."; ./gradlew bootRun --args='--spring.profiles.active=local'
spring.datasource.url=jdbc:postgresql://localhost:5432/company_analysis
spring.datasource.username=ssafy
spring.datasource.password=${POSTGRES_PASSWORD}
