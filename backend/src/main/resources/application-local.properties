# 로컬 실행용. infra 의 postgres 가 127.0.0.1:5432 에 열려 있다.
spring.datasource.url=jdbc:postgresql://localhost:5432/company_analysis
spring.datasource.username=ssafy
spring.datasource.password=${POSTGRES_PASSWORD}

# Vite(:5173)를 프록시 없이 직접 호출하는 경우를 위해 교차 오리진을 열어 둔다.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# 로컬은 http 라 secure 쿠키를 끈다.
server.servlet.session.cookie.secure=false
