# 로컬 실행용. infra/docker-compose.yml 의 postgres 가 127.0.0.1:5432 에 열려 있다.
spring.datasource.url=jdbc:postgresql://localhost:5432/company_analysis
spring.datasource.username=ssafy
spring.datasource.password=${POSTGRES_PASSWORD}

# Vite dev server(:5173)는 백엔드(:8080)와 다른 오리진이다.
# vite.config.ts 의 proxy 를 쓰면 같은 오리진이 되어 CORS 가 필요 없지만,
# frontend/.env 에 VITE_API_BASE_URL=http://localhost:8080 을 넣어 직접 호출하는 경우를 위해 열어 둔다.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
