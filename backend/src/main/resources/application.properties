# 배포 기본값. 비밀·환경별 값은 환경변수로 주입하고, 개발자 PC 전용은 application-local.properties 로 둔다.
spring.application.name=companyanalysis

# 접속 정보는 SPRING_DATASOURCE_* 환경변수로 주입한다(기본값 없음 = 누락 시 기동 실패로 오접속 방지).

# 스키마는 Flyway 가 만들고, JPA 는 엔티티와 불일치 시 기동만 멈춘다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# 값 없는 필드는 키를 남기고 null 로 내보낸다(결측 표현). 규칙: docs/decisions/0001-missing-data-response.md
spring.jackson.default-property-inclusion=always

# health 만 노출(컴포넌트 상태까지). show-details 는 제품·버전이 새어 쓰지 않는다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.health.db.enabled=true
# 켜 두면 15초마다 SMTP 에 접속하고, 느려지면 health 가 503 이 되어 배포가 롤백된다.
management.health.mail.enabled=false

# CORS. 비우면 끈다. prod/dev 는 nginx 로 같은 오리진이라 비우고, 오리진이 갈리는 환경만 APP_CORS_ALLOWED_ORIGINS 로 채운다.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.max-age=1h

# 세션 쿠키. http-only(JS 차단)·same-site=lax(CSRF 완화)·secure(HTTPS 전용, 로컬은 프로파일에서 끔).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# 메일 발송. SMTP 접속은 SPRING_MAIL_* 환경변수로 주입한다(없으면 발송 생략, 링크는 로그로).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 기본값은 무한 대기다. 없으면 응답 없는 SMTP 에 @Async 스레드가 영구히 잡힌다.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:no-reply@company-analysis.local}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.verification.token-ttl=24h

# AI 피드백(SSAFY GMS 프록시, Gemini). 키는 GMS_KEY 환경변수로만 주입한다(클라이언트 노출 금지, 없으면 503).
app.ai.gms.base-url=https://gms.ssafy.io/gmsapi
app.ai.gms.key=${GMS_KEY:}
app.ai.gms.model=gemini-2.5-flash-lite
app.ai.gms.timeout=30s

# 문항 피드백 레이트리밋(공개 API 남용·비용 방어). 게스트=IP, 로그인=userId 기준.
app.feedback.rate-limit.guest-limit=10
app.feedback.rate-limit.user-limit=60
app.feedback.rate-limit.window=1h

# 모의 면접 LLM provider. 개발=vllm(SSAFY GPU, 무료), 시연/최종=gms(Gemini). 값: vllm | gms
app.ai.interview.provider=${AI_INTERVIEW_PROVIDER:vllm}
# vLLM(OpenAI 호환). 키는 LLM_KEY 환경변수로만 주입한다(없으면 503). base-url 은 환경별로 덮어쓴다.
app.ai.vllm.base-url=${VLLM_BASE_URL:http://70.12.130.105:8000}
app.ai.vllm.key=${LLM_KEY:}
app.ai.vllm.model=main
app.ai.vllm.timeout=60s

# 모의 면접 LLM 레이트리밋(로그인 전용). 세션당 질문생성1+꼬리질문N+분석1 호출을 고려한 시간당 상한.
app.interview.rate-limit.user-limit=40
app.interview.rate-limit.window=1h

# 자소서 멀티에이전트. 직무 지식베이스가 실제로 적재된 직무만 적는다(쉼표 구분, 예: backend,frontend).
# 비어 있으면 모든 직무가 ready=false 로 나간다 — 적재는 RAG 파이프라인(S15P21A504-132) 몫이다.
app.agent.ready-job-roles=${APP_AGENT_READY_JOB_ROLES:}
# Vector DB 가 만들어진 기업(쉼표 구분 corpCode). 비어 있으면 "아직 모름" 으로 보고 기업 선택을 막지 않는다.
app.agent.rag-indexed-corp-codes=${APP_AGENT_RAG_INDEXED_CORP_CODES:}
