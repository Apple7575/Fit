# 배포 기본값. 비밀·환경별 값은 환경변수로 주입하고, 개발자 PC 전용은 application-local.properties 로 둔다.
spring.application.name=companyanalysis

# 접속 정보는 SPRING_DATASOURCE_* 환경변수로 주입한다(기본값 없음 = 누락 시 기동 실패로 오접속 방지).

# 스키마는 Flyway 가 만들고, JPA 는 엔티티와 불일치 시 기동만 멈춘다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# 값 없는 필드는 키를 남기고 null 로 내보낸다(결측 표현). 규칙: docs/decisions/0001-missing-data-response.md
spring.jackson.default-property-inclusion=always

# health 만 노출(컴포넌트 상태까지). show-details 는 제품·버전이 새어 쓰지 않는다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.health.db.enabled=true
# 켜 두면 15초마다 SMTP 에 접속하고, 느려지면 health 가 503 이 되어 배포가 롤백된다.
management.health.mail.enabled=false

# CORS. 비우면 끈다. prod/dev 는 nginx 로 같은 오리진이라 비우고, 오리진이 갈리는 환경만 APP_CORS_ALLOWED_ORIGINS 로 채운다.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.max-age=1h

# 세션 쿠키. http-only(JS 차단)·same-site=lax(CSRF 완화)·secure(HTTPS 전용, 로컬은 프로파일에서 끔).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# 메일 발송. SMTP 접속은 SPRING_MAIL_* 환경변수로 주입한다(없으면 발송 생략, 링크는 로그로).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 기본값은 무한 대기다. 없으면 응답 없는 SMTP 에 @Async 스레드가 영구히 잡힌다.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:no-reply@company-analysis.local}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.verification.token-ttl=24h

# AI 피드백(SSAFY GMS 프록시, Gemini). 키는 GMS_KEY 환경변수로만 주입한다(클라이언트 노출 금지, 없으면 503).
app.ai.gms.base-url=https://gms.ssafy.io/gmsapi
app.ai.gms.key=${GMS_KEY:}
app.ai.gms.model=gemini-2.5-flash-lite
app.ai.gms.timeout=30s

# 공고 URL 확인 레이트리밋(공개 API 남용·비용 방어). 게스트=IP, 로그인=userId 기준.
# 붙여넣은 공고 이미지 업로드. 장당 한도는 AI 쪽 OCR 상한(8MB)과 맞추고, 전체는 프록시
# client_max_body_size(20m) 안에 둔다.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=20MB

# 임시 운영 설정: 공고 분석 요청 제한 해제. 복구 시 게스트=10, 로그인=60으로 되돌린다.
app.job-posting.rate-limit.guest-limit=2147483647
app.job-posting.rate-limit.user-limit=2147483647
app.job-posting.rate-limit.window=1h

# 모의 면접 LLM provider. 개발=vllm(SSAFY GPU, 무료), 시연/최종=gms(Gemini). 값: vllm | gms
app.ai.interview.provider=${AI_INTERVIEW_PROVIDER:vllm}
# vLLM(OpenAI 호환). 키는 LLM_KEY 환경변수로만 주입한다(없으면 503). base-url 은 환경별로 덮어쓴다.
app.ai.vllm.base-url=${VLLM_BASE_URL:http://70.12.130.105:8000}
app.ai.vllm.key=${LLM_KEY:}
app.ai.vllm.model=main
# vLLM(Qwen) 은 응답이 느리다(피드백 실측 ~58s). 터널·큰 프롬프트 여유로 150s. nginx /api/interviews/ 는 이보다 커야 한다.
app.ai.vllm.timeout=150s

# 모의 면접 LLM 레이트리밋(로그인 전용). 세션당 질문생성1+꼬리질문N+분석1 호출을 고려한 시간당 상한.
app.interview.rate-limit.user-limit=40
app.interview.rate-limit.window=1h

# 자소서 멀티에이전트.
# Vector DB 가 만들어진 기업(쉼표 구분 corpCode). 비어 있으면 "아직 모름" 으로 보고 기업 선택을 막지 않는다.
app.agent.rag-indexed-corp-codes=${APP_AGENT_RAG_INDEXED_CORP_CODES:}
# 화면에서 감출 담당(쉼표 구분 agentKey: jd, company, position, news, writing).
# 구현이 덜 된 담당을 QA 동안 안 보이게 해 두는 스위치다. 비어 있으면 전부 보인다(기본값).
# 기능을 떼는 것이 아니라 가리는 것이다 — 서버 API 도 AI 워커도 그대로 돌고, 방에 저장된
# 담당 목록도 그대로 남아서 이 값만 비우면 원래대로 돌아온다.
app.agent.hidden-agents=${APP_AGENT_HIDDEN_AGENTS:}

# 검토 방 분석 레이트리밋. 발화 한 번에 LLM 을 여러 번 부르므로 비용을 막는다(로그인 전용).
# 임시 운영 설정: 검토 방 분석 요청 제한 해제. 복구 시 20으로 되돌린다.
app.agent.rate-limit.user-limit=2147483647
app.agent.rate-limit.window=1h

# 담당 에이전트를 맡은 AI 서버(FastAPI). 프록시를 안 거치는 서버 간 주소를 넣는다.
# 비우면 검토 방의 담당들이 자기 자리에서 실패한다. 공고 등록도 같은 주소를 쓴다.
app.ai.agent.base-url=${AGENT_AI_BASE_URL:}
# 공고 등록처럼 단발로 부르는 호출. Qwen 응답이 느리다(모의 면접 실측 ~58초).
app.ai.agent.timeout=150s
# 총괄·뉴스 호출. 총괄 명세가 정해 둔 값이 120초다 — 담당 여럿을 돌리고 종합까지 한다.
app.ai.agent.supervisor-timeout=120s
