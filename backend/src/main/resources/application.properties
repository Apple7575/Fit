# 기본 프로파일 = 배포용 안전 기본값. 비밀값과 환경별로 달라지는 값은 여기 두지 않고
# 환경변수로 주입한다. 개발자 PC 에서만 쓰는 값은 application-local.properties 로 분리한다.
spring.application.name=companyanalysis

# DataSource
# 접속 정보는 환경변수 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 로 주입한다.
# 여기에 기본값을 두지 않는 이유: 값이 빠졌을 때 기동에 실패해야 잘못된 DB에 조용히
# 붙는 사고를 막을 수 있다. 로컬 실행은 local 프로파일을 쓴다.

# 스키마는 Flyway 가 만든다. JPA 는 엔티티와 실제 테이블이 어긋나면 기동을 멈추게만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# DB 연결 상태 확인용. health 만 노출하고, 컴포넌트별 상태(db: UP)까지 보여준다.
# show-details 는 DB 제품·버전까지 노출하므로 쓰지 않는다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.health.db.enabled=true

# CORS
# 기본은 비워 둔다 = 교차 출처 요청을 받지 않는다. prod/dev 배포는 infra/proxy 의 nginx 가
# FE 와 BE 를 같은 오리진(/api)으로 묶으므로 CORS 가 필요 없기 때문이다.
# FE 가 다른 오리진에 뜨는 환경에서만 APP_CORS_ALLOWED_ORIGINS 로 주입한다.
#   예) 로컬 compose 실행(FE :3000 / BE :8080) → APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
# 자세한 내용은 infra/README.md 의 '로컬 실행' 참고.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.cors.max-age=1h
