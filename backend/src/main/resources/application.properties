spring.application.name=companyanalysis

# DataSource
# 접속 정보는 환경변수 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 로 주입한다.
# 여기에 기본값을 두지 않는 이유: 값이 빠졌을 때 기동에 실패해야 잘못된 DB에 조용히
# 붙는 사고를 막을 수 있다. 로컬 실행은 local 프로파일을 쓴다.

# 스키마는 Flyway 가 만든다. JPA 는 엔티티와 실제 테이블이 어긋나면 기동을 멈추게만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# DB 연결 상태 확인용. health 만 노출하고, 컴포넌트별 상태(db: UP)까지 보여준다.
# show-details 는 DB 제품·버전까지 노출하므로 쓰지 않는다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.health.db.enabled=true
